{% extends "base.html" %}

{% block page_title %}Add Department{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Add Department</h2>
    <a href="{{ url_for('departments.index') }}" class="btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Back
    </a>
</div>

<div class="form-card">
    <form method="POST" id="department-form">
        <div class="form-group">
            <label>Department Name <span class="required">*</span></label>
            <input type="text" name="name" placeholder="e.g. Engineering" required minlength="2">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" placeholder="Brief description..." rows="3"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Save Department</button>
            <a href="{{ url_for('departments.index') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
