{% extends "base.html" %}

{% block page_title %}New Project{% endblock %}

{% block content %}
<div class="page-header">
    <h2>New Project</h2>
    <a href="{{ url_for('projects.index') }}" class="btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Back
    </a>
</div>

<div class="form-card">
    <form method="POST" id="project-form">
        <div class="form-group">
            <label>Project Name <span class="required">*</span></label>
            <input type="text" name="name" placeholder="e.g. Website Redesign" required minlength="2">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" placeholder="What is this project about?" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>Status <span class="required">*</span></label>
            <select name="status" required>
                <option value="active">Active</option>
                <option value="on_hold">On Hold</option>
                <option value="completed">Completed</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Create Project</button>
            <a href="{{ url_for('projects.index') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
