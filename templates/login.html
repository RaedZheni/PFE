<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HR Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-left">
        <div class="auth-brand">
            <i class="fa-solid fa-building-user"></i>
            <h1>HR Manager</h1>
            <p>Manage your team, contracts, and projects in one place.</p>
        </div>
    </div>
    <div class="auth-right">
        <div class="auth-box">
            <h2>Welcome back</h2>
            <p class="auth-sub">Sign in to your account</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" id="login-form">
                <div class="form-group">
                    <label>Username <span class="required">*</span></label>
                    <div class="input-icon">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" name="username" placeholder="Enter username" required minlength="3">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" placeholder="Enter password" required minlength="6">
                    </div>
                </div>
                <button type="submit" class="btn-primary full">Sign In</button>
            </form>

            <p class="auth-footer">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
        </div>
    </div>
</div>

</body>
</html>
