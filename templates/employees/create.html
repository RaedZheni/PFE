{% extends "base.html" %}

{% block page_title %}Add Employee{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Add Employee</h2>
    <a href="{{ url_for('employees.index') }}" class="btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Back
    </a>
</div>

<div class="form-card">
    <form method="POST" id="employee-form">
        <div class="form-row">
            <div class="form-group">
                <label>First Name <span class="required">*</span></label>
                <input type="text" name="first_name" placeholder="First name" required minlength="2">
            </div>
            <div class="form-group">
                <label>Last Name <span class="required">*</span></label>
                <input type="text" name="last_name" placeholder="Last name" required minlength="2">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" name="email" placeholder="Email address" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="phone" placeholder="+216 XX XXX XXX">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Role</label>
                <input type="text" name="role" placeholder="Job title">
            </div>
            <div class="form-group">
                <label>Department</label>
                <select name="department_id">
                    <option value="">-- Select Department --</option>
                    {% for dept in departments %}
                    <option value="{{ dept.id }}">{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Save Employee</button>
            <a href="{{ url_for('employees.index') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
