{% extends "base.html" %}

{% block page_title %}New Contract{% endblock %}

{% block content %}
<div class="page-header">
    <h2>New Contract</h2>
    <a href="{{ url_for('contracts.index') }}" class="btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Back
    </a>
</div>

<div class="form-card">
    <form method="POST" id="contract-form">
        <div class="form-row">
            <div class="form-group">
                <label>Employee <span class="required">*</span></label>
                <select name="employee_id" required>
                    <option value="">-- Select Employee --</option>
                    {% for emp in employees %}
                    <option value="{{ emp.id }}">{{ emp.first_name }} {{ emp.last_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Contract Type <span class="required">*</span></label>
                <select name="type" required>
                    <option value="">-- Select Type --</option>
                    <option value="CDI">CDI</option>
                    <option value="CDD">CDD</option>
                    <option value="Internship">Internship</option>
                    <option value="Freelance">Freelance</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Start Date <span class="required">*</span></label>
                <input type="date" name="start_date" required>
            </div>
            <div class="form-group">
                <label>End Date <small>(leave empty for CDI)</small></label>
                <input type="date" name="end_date">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Salary (€)</label>
                <input type="number" name="salary" min="0" placeholder="e.g. 3500">
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Save Contract</button>
            <a href="{{ url_for('contracts.index') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
