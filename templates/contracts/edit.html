{% extends "base.html" %}

{% block page_title %}Edit Contract{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Edit Contract</h2>
    <a href="{{ url_for('contracts.index') }}" class="btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Back
    </a>
</div>

<div class="form-card">
    <form method="POST" id="contract-form">
        <div class="form-row">
            <div class="form-group">
                <label>Employee <span class="required">*</span></label>
                <select name="employee_id" required>
                    <option value="">-- Select Employee --</option>
                    {% for emp in employees %}
                    <option value="{{ emp.id }}" {% if contract.employee_id == emp.id %}selected{% endif %}>
                        {{ emp.first_name }} {{ emp.last_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Contract Type <span class="required">*</span></label>
                <select name="type" required>
                    <option value="">-- Select Type --</option>
                    <option value="CDI" {% if contract.type == 'CDI' %}selected{% endif %}>CDI</option>
                    <option value="CDD" {% if contract.type == 'CDD' %}selected{% endif %}>CDD</option>
                    <option value="Internship" {% if contract.type == 'Internship' %}selected{% endif %}>Internship</option>
                    <option value="Freelance" {% if contract.type == 'Freelance' %}selected{% endif %}>Freelance</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Start Date <span class="required">*</span></label>
                <input type="date" name="start_date" value="{{ contract.start_date.strftime('%Y-%m-%d') }}" required>
            </div>
            <div class="form-group">
                <label>End Date <small>(leave empty for CDI)</small></label>
                <input type="date" name="end_date" value="{{ contract.end_date.strftime('%Y-%m-%d') if contract.end_date else '' }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Salary (€)</label>
                <input type="number" name="salary" min="0" value="{{ contract.salary | int if contract.salary else '' }}">
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Update Contract</button>
            <a href="{{ url_for('contracts.index') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
